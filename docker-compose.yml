services:

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: taskhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskhub_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # host-local only (handy for psql). 5433 so it doesn't clash with a Postgres already running on the host's 5432
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskhub_backend
    restart: unless-stopped
    environment:
      # Owner connection: migrations + setting the app role's password only
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/taskhub_db
      # Runtime connection: restricted role so Row Level Security is enforced
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DATABASE_URL: postgresql://taskhub_app:${APP_DB_PASSWORD}@postgres:5432/taskhub_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      PORT: 3001
      NODE_ENV: production
      TRUST_PROXY: 1                                   # nginx is one hop in front
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}  # login/signup attempts per IP per 15 min
      COOKIE_SECURE: ${COOKIE_SECURE:-}                # blank = secure in production
    ports:
      - "127.0.0.1:3001:3001"   # direct API access from this machine only; the UI goes through nginx (/api)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # Frontend (nginx: static files + /api reverse proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskhub_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
